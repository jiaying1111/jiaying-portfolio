# Tencent Cloud Lighthouse — reverse proxy for Next.js (port 3000).
# 1. Replace YOUR_CN_DOMAIN with the China domain (e.g. jiayingli.cn).
# 2. Copy to: /etc/nginx/sites-available/portfolio
# 3. Enable: ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
# 4. After ICP + SSL: uncomment the HTTPS server block and cert paths.

upstream portfolio_next {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name YOUR_CN_DOMAIN;

  # ACME / certbot
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Before HTTPS is ready, proxy HTTP directly.
  # After certbot, prefer: return 301 https://$host$request_uri;
  location / {
    proxy_pass http://portfolio_next;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  client_max_body_size 20m;
}

